<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUST II — ТЕРОРИСТИ (T) 💣</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .map-card {
            background: #14161d;
            border: 1px solid #232733;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .map-card-img-wrapper {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #181b24;
        }

        .map-card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .map-title {
            padding: 15px 10px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            margin: 0;
            background: #14161d;
            letter-spacing: 0.5px;
            transition: color 0.25s ease;
        }

        .card-link:hover .map-card {
            border-color: #ff9800;
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(255, 152, 0, 0.25);
        }

        .card-link:hover img {
            transform: scale(1.06);
        }

        .card-link:hover .map-title {
            color: #ff9800;
        }
    </style>
</head>
<body>

    <!-- КНОПКА НАЗАД -->
    <a href="dust2.html" class="back-btn" onclick="if(history.length > 1){ history.back(); return false; }">← НАЗАД</a>

    <div class="header-title">DUST II — ТАКТИКИ (T) 💣</div>

    <div class="guide-container" style="max-width: 1100px; display: block !important;">

        <div class="tip-box">
            📍 <b>Порада для телефонів:</b> Щоб бачити сторінку точно так само, як на комп'ютері, відкрий меню браузера (3 крапки) та постав галочку «Версія для комп'ютера».
        </div>

        <div class="cards-grid">

            <!-- 1. B SITE -->
            <a href="dust2-t-b.html" class="card-link">
                <div class="map-card">
                    <div class="map-card-img-wrapper">
                        <img src="images/dust2-t-b.jpg" alt="B Site">
                    </div>
                    <div class="map-title">💣 B Site</div>
                </div>
            </a>

            <!-- 2. SHORT -->
            <a href="dust2-t-short.html" class="card-link">
                <div class="map-card">
                    <div class="map-card-img-wrapper">
                        <img src="images/dust2-t-short-smokes-drop.jpg" alt="Short">
                    </div>
                    <div class="map-title">🎯 Short</div>
                </div>
            </a>

            <!-- 3. MID -->
            <a href="dust2-t-mid.html" class="card-link">
                <div class="map-card">
                    <div class="map-card-img-wrapper">
                        <img src="images/dust2-t-mid.jpg" alt="Mid">
                    </div>
                    <div class="map-title">⚔️ Mid</div>
                </div>
            </a>

            <!-- 4. LONG -->
            <a href="dust2-t-long.html" class="card-link">
                <div class="map-card">
                    <div class="map-card-img-wrapper">
                        <img src="images/dust2-t-long.jpg" alt="Long">
                    </div>
                    <div class="map-title">🛡️ Long</div>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
