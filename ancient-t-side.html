<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANCIENT — Т ПОЗИЦІЇ</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body>

    <!-- РОЗУМНА КНОПКА НАЗАД -->
    <a href="ancient.html" class="back-btn" onclick="if(history.length > 1){ history.back(); return false; }">← НАЗАД</a>

    <div class="header-title">ANCIENT — Т ПОЗИЦІЇ</div>

    <div class="guide-container" style="max-width: 1150px;">

        <div class="tip-box">
            📍 <b>Порада для телефонів:</b> Щоб бачити сторінку точно так само, як на комп'ютері, відкрий меню браузера (3 крапки) та постав галочку «Версія для комп'ютера».
        </div>

        <div class="cards-grid">

            <!-- 1. РОЗКИД A SITE -->
            <a href="ancient-a-site.html" class="card-link">
                <div class="map-card">
                    <img src="фото/ancient-a-site.jpg" alt="Розкид A site" class="step-img" onerror="this.src='фото/ancient-a-site.png'">
                    <div class="map-title">Розкид A site</div>
                </div>
            </a>

            <!-- 2. РОЗКИД MID -->
            <a href="ancient-mid.html" class="card-link">
                <div class="map-card">
                    <img src="фото/ancient-mid.jpg" alt="Розкид Mid" class="step-img" onerror="this.src='фото/ancient-mid.png'">
                    <div class="map-title">Розкид Mid</div>
                </div>
            </a>

            <!-- 3. РОЗКИД B SITE -->
            <a href="ancient-b-site.html" class="card-link">
                <div class="map-card">
                    <img src="фото/ancient-b-site.jpg" alt="Розкид B site" class="step-img" onerror="this.src='фото/ancient-b-site.png'">
                    <div class="map-title">Розкид B site</div>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
