<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Tactics - Карти</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .map-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, border-color 0.2s ease;
            aspect-ratio: 16 / 9;
            background-color: #1a1a24;
        }

        .map-card:hover {
            transform: translateY(-5px);
            border-color: #ff4655;
        }

        .map-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .map-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>ОБЕРІТЬ КАРТУ</h1>
    </header>

    <main>
        <div class="map-grid">
            <a href="mirage.html" class="map-card">
                <img src="mirage.jpg" alt="Mirage" onerror="this.src='mirage.png'">
                <div class="map-title">Mirage</div>
            </a>

            <a href="ancient.html" class="map-card">
                <img src="ancient.png" alt="Ancient" onerror="this.src='ancient.jpg'">
                <div class="map-title">Ancient</div>
            </a>
        </div>
    </main>

</body>
</html>
