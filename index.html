<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 TACTICS — ОБЕРИ КАРТУ</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        /* 3 кнопки швидкого доступу в шапці */
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #14161d;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 13.5px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }

        /* Бінди (Синій) */
        .btn-binds {
            border: 1px solid #4b69ff;
            color: #4b69ff;
        }
        .btn-binds:hover {
            background: #4b69ff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(75, 105, 255, 0.5);
        }

        /* Мій раунд (Золотий) */
        .btn-round {
            border: 1px solid #ffd700;
            color: #ffd700;
        }
        .btn-round:hover {
            background: #ffd700;
            color: #0d0e12;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Створи свій CFG (Смарагдовий / Зелений) */
        .btn-cfg {
            border: 1px solid #00e676;
            color: #00e676;
        }
        .btn-cfg:hover {
            background: #00e676;
            color: #0d0e12;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.5);
        }

        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 15px;
        }

        .map-card {
            background: #14161d;
            border: 1px solid #232733;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .map-card-img-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
        }

        .map-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            margin: 0;
            border-radius: 0;
            border: none;
            transition: transform 0.3s ease;
        }

        .map-card-title {
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            margin: 0;
            background: #14161d;
            transition: color 0.3s ease;
        }

        .map-card:hover {
            border-color: #ff4655;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 70, 85, 0.25);
        }

        .map-card:hover img { transform: scale(1.08); }
        .map-card:hover .map-card-title { color: #ff4655; }
    </style>
</head>
<body>

    <header class="header-top">
        <h1 style="margin: 0;">ОБЕРИ КАРТУ</h1>
        
        <!-- НАВІГАЦІЯ: БІНДИ, МІЙ РАУНД, ГЕНЕРАТОР КФГ -->
        <div class="header-actions">
            <a href="binds.html" class="action-nav-btn btn-binds">⌨️ БІНДИ & КОМАНДИ</a>
            <a href="my-round.html" class="action-nav-btn btn-round">⭐ МІЙ РАУНД</a>
            <a href="config-generator.html" class="action-nav-btn btn-cfg">⚙️ СТВОРИ СВІЙ CFG</a>
        </div>
    </header>

    <main>

        <div class="maps-grid">

            <!-- MIRAGE -->
            <a href="side.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="images/mirage.png" alt="Mirage" onerror="this.src='images/mirage.jpg'">
                </div>
                <h3 class="map-card-title">Mirage</h3>
            </a>

            <!-- ANCIENT -->
            <a href="ancient.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="images/ancient.png" alt="Ancient" onerror="this.src='images/ancient.jpg'">
                </div>
                <h3 class="map-card-title">Ancient</h3>
            </a>

            <!-- DUST II -->
            <a href="dust2.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="images/dust2.png" alt="Dust II" onerror="this.src='images/dust2.jpg'">
                </div>
                <h3 class="map-card-title">Dust II</h3>
            </a>

        </div>

    </main>

</body>
</html>
