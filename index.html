<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 TAKTICS — ОБЕРИ КАРТУ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .my-round-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #14161d;
            border: 1px solid #ff4655;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .my-round-btn:hover {
            background: #ff4655;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 70, 85, 0.4);
        }

        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 0 15px;
        }

        /* Основна картка */
        .map-card {
            background: #14161d;
            border: 1px solid #232733;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .map-card-img-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
        }

        .map-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .map-card-title {
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            margin: 0;
            background: #14161d;
            transition: color 0.3s ease;
        }

        /* ЕФЕКТИ ПРИ НАВЕДЕННІ */
        .map-card:hover {
            border-color: #ff4655;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 70, 85, 0.2);
        }

        .map-card:hover img {
            transform: scale(1.08);
        }

        .map-card:hover .map-card-title {
            color: #ff4655;
        }
    </style>
</head>
<body>

    <header class="header-top">
        <h1 style="margin: 0;">ОБЕРИ КАРТУ</h1>
        <!-- КНОПКА МІЙ РАУНД -->
        <a href="my-round.html" class="my-round-btn">⭐ МІЙ РАУНД</a>
    </header>

    <main>

        <div class="maps-grid">

            <!-- MIRAGE (йде на side.html) -->
            <a href="side.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="фото/mirage.png" alt="Mirage" onerror="this.src='фото/mirage.jpg'">
                </div>
                <h3 class="map-card-title">Mirage</h3>
            </a>

            <!-- ANCIENT -->
            <a href="ancient.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="фото/ancient.png" alt="Ancient" onerror="this.src='фото/ancient.jpg'">
                </div>
                <h3 class="map-card-title">Ancient</h3>
            </a>

            <!-- DUST II -->
            <a href="dust2.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="фото/dust2.png" alt="Dust II" onerror="this.src='фото/dust2.jpg'">
                </div>
                <h3 class="map-card-title">Dust II</h3>
            </a>

        </div>

    </main>

</body>
</html>
