<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 TACTICS — ОБЕРИ КАРТУ</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        /* Блок кнопок швидкого доступу */
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Кнопка Бінди & Команди */
        .binds-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #14161d;
            border: 1px solid #4b69ff;
            color: #4b69ff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }

        .binds-btn:hover {
            background: #4b69ff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(75, 105, 255, 0.5);
        }

        /* Кнопка Мій Раунд */
        .my-round-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #14161d;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }

        .my-round-btn:hover {
            background: #ffd700;
            color: #0d0e12;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 15px;
        }

        .map-card {
            background: #14161d;
            border: 1px solid #232733;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .map-card-img-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
        }

        .map-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            margin: 0;
            border-radius: 0;
            border: none;
            transition: transform 0.3s ease;
        }

        .map-card-title {
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            margin: 0;
            background: #14161d;
            transition: color 0.3s ease;
        }

        .map-card:hover {
            border-color: #ff4655;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 70, 85, 0.25);
        }

        .map-card:hover img {
            transform: scale(1.08);
        }

        .map-card:hover .map-card-title {
            color: #ff4655;
        }
    </style>
</head>
<body>

    <header class="header-top">
        <h1 style="margin: 0;">ОБЕРИ КАРТУ</h1>
        
        <!-- НАВІГАЦІЙНІ КНОПКИ: БІНДИ ЗЛІВА, МІЙ РАУНД СПРАВА -->
        <div class="header-actions">
            <a href="binds.html" class="binds-btn">⌨️ БІНДИ & КОМАНДИ</a>
            <a href="my-round.html" class="my-round-btn">⭐ МІЙ РАУНД</a>
        </div>
    </header>

    <main>

        <div class="maps-grid">

            <!-- MIRAGE -->
            <a href="side.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="фото/mirage.png" alt="Mirage" onerror="this.src='фото/mirage.jpg'">
                </div>
                <h3 class="map-card-title">Mirage</h3>
            </a>

            <!-- ANCIENT -->
            <a href="ancient.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="фото/ancient.png" alt="Ancient" onerror="this.src='фото/ancient.jpg'">
                </div>
                <h3 class="map-card-title">Ancient</h3>
            </a>

            <!-- DUST II -->
            <a href="dust2.html" class="map-card">
                <div class="map-card-img-wrapper">
                    <img src="фото/dust2.png" alt="Dust II" onerror="this.src='фото/dust2.jpg'">
                </div>
                <h3 class="map-card-title">Dust II</h3>
            </a>

        </div>

    </main>

</body>
</html>
