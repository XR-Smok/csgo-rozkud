<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUST II — ONE WAY SMOKE A</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .grid-2-col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- РОЗУМНА КНОПКА НАЗАД -->
    <a href="dust2-ct-side.html" class="back-btn" onclick="if(history.length > 1){ history.back(); return false; }">← НАЗАД</a>

    <div class="header-title">DUST II — ONE WAY SMOKE A</div>

    <div class="guide-container">

        <div class="tip-box">
            📍 <b>Порада для телефонів:</b> Щоб бачити сторінку точно так само, як на комп'ютері, відкрий меню браузера (3 крапки) та постав галочку «Версія для комп'ютера».
        </div>

        <!-- 1. ONE WAY SMOKE A (КАРТКА РОЗКИДКИ) -->
        <div class="step-card" id="d2-ct-oneway-a">
            <div class="card-top-actions">
                <button class="hide-card-btn" onclick="hideCard('d2-ct-oneway-a', 'One Way Smoke A')" title="Сховати цей смок">👁️</button>
                <button class="fav-star-btn" data-id="d2-ct-oneway-a" onclick="toggleFavoriteCard(this, 'd2-ct-oneway-a', 'DUST II CT: One Way Smoke A', 'dust2-ct-smoke-a.html')">☆</button>
            </div>

            <div class="step-title">🌫️ ONE WAY SMOKE A</div>

            <!-- ВСТАВАЙ ТУТ -->
            <div style="margin-bottom: 15px;">
                <div class="step-description" style="margin-bottom: 8px;">📍 ВСТАВАЙ ТУТ</div>
                <img src="фото/dust2-ct-smoke-a-stand.jpg" alt="Вставай тут" class="step-img" onerror="this.src='фото/dust2-ct-smoke-a-stand.png'">
            </div>

            <!-- ДВІ ФОТО В РЯД: ЦІЛЬСЯ ТУТ + ВПАДЕ ТУТ -->
            <div class="grid-2-col">
                <div>
                    <div class="step-description" style="margin-bottom: 8px;">🎯 ЦІЛЬСЯ ТУТ</div>
                    <img src="фото/dust2-ct-smoke-a-aim.jpg" alt="Цілься тут" class="step-img" onerror="this.src='фото/dust2-ct-smoke-a-aim.png'">
                </div>
                <div>
                    <div class="step-description" style="margin-bottom: 8px;">💥 ВПАДЕ ТУТ</div>
                    <img src="фото/dust2-ct-smoke-a.jpg" alt="Впаде тут" class="step-img" onerror="this.src='фото/dust2-ct-smoke-a.png'">
                </div>
            </div>

            <div class="action-badge">⚡ КИДОК: ЛКМ</div>
        </div>

        <!-- ================= БЛОК ПРИХОВАНИХ РОЗКИДОК ================= -->
        <div id="hiddenSection" class="hidden-section" style="display: none;">
            <div class="hidden-section-header">
                <h4 class="hidden-section-title">📦 Приховані розкидки (<span id="hiddenCount">0</span>)</h4>
                <button onclick="restoreAllCards()" class="restore-all-btn">Повернути всі</button>
            </div>
            <div id="hiddenList" class="hidden-list"></div>
        </div>

    </div>

    <!-- ПІДКЛЮЧЕННЯ СКРИПТІВ -->
    <script src="favorites.js"></script>
    <script src="gallery.js"></script>

</body>
</html>
