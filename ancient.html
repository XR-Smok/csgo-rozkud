<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANCIENT — СТОРОНА</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .sides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 850px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .side-card {
            background: #14161d;
            border: 1px solid #232733;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .side-card-img-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
        }

        .side-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .side-card-title {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin: 0;
            background: #14161d;
        }

        /* T-SIDE СТИЛІ */
        .side-card.t-side .side-card-title {
            color: #ff4655;
        }

        .side-card.t-side:hover {
            border-color: #ff4655;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 70, 85, 0.25);
        }

        /* CT-SIDE СТИЛІ */
        .side-card.ct-side .side-card-title {
            color: #4b69ff;
        }

        .side-card.ct-side:hover {
            border-color: #4b69ff;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(75, 105, 255, 0.25);
        }

        .side-card:hover img {
            transform: scale(1.08);
        }

        /* Неактивні картки */
        .side-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .side-card.disabled:hover {
            border-color: #232733;
            transform: none;
            box-shadow: none;
        }

        .side-card.disabled:hover img {
            transform: none;
        }

        .side-card.disabled .side-card-title {
            color: #888;
        }
    </style>
</head>
<body>

    <!-- ПЛАВАЮЧА КНОПКА НАЗАД -->
    <a href="index.html" class="back-btn" onclick="if(history.length > 1){ history.back(); return false; }">← НАЗАД</a>

    <header>
        <h1>ANCIENT</h1>
    </header>

    <main>

        <div class="sides-grid">

            <!-- TERRORISTS (T) -->
            <a href="ancient-t-side.html" class="side-card t-side">
                <div class="side-card-img-wrapper">
                    <img src="images/t-side.jpg" alt="Terrorists" class="step-img">
                </div>
                <h3 class="side-card-title">Terrorists (T)</h3>
            </a>

            <!-- COUNTER-TERRORISTS (CT) — ТЕПЕР АКТИВНО -->
            <a href="ancient-ct-side.html" class="side-card ct-side">
                <div class="side-card-img-wrapper">
                    <img src="images/ct-side.jpg" alt="Counter-Terrorists" class="step-img">
                </div>
                <h3 class="side-card-title">Counter-Terrorists (CT)</h3>
            </a>

        </div>

    </main>

    <!-- ПІДКЛЮЧЕННЯ СКРИПТІВ -->
    <script src="favorites.js"></script>
    <script src="gallery.js"></script>

</body>
</html>
