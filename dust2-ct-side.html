<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUST II — CT ТАКТИКИ 🛡️</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .map-card {
            background: #14161d;
            border: 1px solid #232733;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .map-card-img-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .map-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            margin: 0;
            border-radius: 0;
            border: none;
            transition: transform 0.3s ease;
        }

        .map-title {
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 17px;
            margin: 0;
            background: #14161d;
            transition: color 0.3s ease;
            letter-spacing: 0.5px;
        }

        .map-card:hover {
            border-color: #4b69ff;
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(75, 105, 255, 0.3);
        }

        .map-card:hover img {
            transform: scale(1.08);
        }

        .map-card:hover .map-title {
            color: #4b69ff;
        }
    </style>
</head>
<body>

    <!-- РОЗУМНА КНОПКА НАЗАД -->
    <a href="dust2.html" class="back-btn" onclick="if(history.length > 1){ history.back(); return false; }">← НАЗАД</a>

    <div class="header-title">DUST II — CT ТАКТИКИ 🛡️</div>

    <div class="guide-container" style="max-width: 900px;">

        <!-- ПІДКАЗКА ДЛЯ ТЕЛЕФОНІВ -->
        <div class="tip-box">
            📍 <b>Порада для телефонів:</b> Щоб бачити сторінку точно так само, як на комп'ютері, відкрий меню браузера (3 крапки) та постав галочку «Версія для комп'ютера».
        </div>

        <!-- СІТКА КАРТОК -->
        <div class="cards-grid">

            <!-- 1. ONE WAY SMOKE A -->
            <a href="dust2-ct-smoke-a.html" class="card-link">
                <div class="map-card">
                    <div class="map-card-img-wrapper">
                        <img src="фото/dust2-ct-smoke-a.jpg" alt="One Way Smoke A" onerror="this.src='фото/dust2-ct-smoke-a.png'">
                    </div>
                    <div class="map-title">🌫️ One Way Smoke A</div>
                </div>
            </a>

            <!-- 2. RETAKE B -->
            <a href="dust2-ct-retake-b.html" class="card-link">
                <div class="map-card">
                    <div class="map-card-img-wrapper">
                        <img src="фото/dust2-ct-retake-b.jpg" alt="Retake B" onerror="this.src='фото/dust2-ct-retake-b.png'">
                    </div>
                    <div class="map-title">💣 Retake B Site</div>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
