<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAGE — ПОЗИЦІЇ (T)</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body>

    <!-- РОЗУМНА КНОПКА НАЗАД -->
    <a href="side.html" class="back-btn" onclick="if(history.length > 1){ history.back(); return false; }">← НАЗАД</a>

    <div class="header-title">MIRAGE — ПОЗИЦІЇ (T)</div>

    <div class="guide-container" style="max-width: 1100px;">

        <div class="tip-box">
            📍 <b>Порада для телефонів:</b> Щоб бачити сторінку точно так само, як на комп'ютері, відкрий меню браузера (3 крапки) та постав галочку «Версія для комп'ютера».
        </div>

        <div class="cards-grid">

            <!-- 1. РОЗКИД A SITE -->
            <a href="t-asite.html" class="card-link">
                <div class="map-card">
                    <img src="фото/t-asite.jpg" alt="Розкид A site" class="step-img" onerror="this.src='фото/t-asite.png'">
                    <div class="map-title">Розкид A site</div>
                </div>
            </a>

            <!-- 2. РОЗКИД PALACE (ПАЛАЦ) -->
            <a href="t-palace.html" class="card-link">
                <div class="map-card">
                    <img src="фото/palace-preview.jpg" alt="Розкид Palace" class="step-img" onerror="this.src='фото/palace-preview.png'">
                    <div class="map-title">Розкид Palace (Палац)</div>
                </div>
            </a>

            <!-- 3. РОЗКИД MID -->
            <a href="t-mid.html" class="card-link">
                <div class="map-card">
                    <img src="фото/t-mid.jpg" alt="Розкид Mid" class="step-img" onerror="this.src='фото/t-mid.png'">
                    <div class="map-title">Розкид Mid</div>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
